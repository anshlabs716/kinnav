# Sized for a small machine. Metaspace must stay well above 384m: R8 and lint both load
# enough classes to OOM the metaspace at that size. 1G is the floor that completes a release
# build; the heap is the part that can be cut.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# One JVM instead of three. The Kotlin compiler daemon is a separate process and Gradle forks
# its own, so the default configuration runs the build across multiple multi-hundred-megabyte
# heaps at once. In-process compilation puts the Kotlin compiler in the Gradle daemon.
kotlin.compiler.execution.strategy=in-process

# Build one task at a time on one worker. Parallel execution raises peak memory well past what
# this build needs and the tasks here are mostly sequential anyway.
org.gradle.parallel=false
org.gradle.workers.max=1

# Reuse configuration and build outputs across runs, which cuts repeated build time.
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
kotlin.code.style=official
